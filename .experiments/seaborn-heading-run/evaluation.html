<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Specification loop evaluation</title>
<style>
:root{font:16px 'Segoe UI',Arial,sans-serif;color:#192b40;background:#f5f8fc}
body{max-width:1200px;margin:32px auto;padding:0 24px}h1{font-size:28px;margin-bottom:8px}
h2{font-size:21px}p{color:#50627a}section{margin:28px 0;background:white;padding:24px;border:1px solid #d5dfec}
select,button{font:inherit;padding:8px 12px;border:1px solid #a5b5c9;background:white;border-radius:4px}
button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #315dcc}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.chart{overflow-x:auto}
svg{display:block;width:100%;min-width:650px;height:auto}svg text{font:13px 'Segoe UI',Arial,sans-serif;fill:#50627a}
#legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0}#legend label{font-size:14px;cursor:pointer}
.swatch{display:inline-block;width:12px;height:12px;margin:0 5px;border-radius:50%}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.65 Consolas,Menlo,monospace;background:#f5f8fc;padding:20px;border:1px solid #d5dfec}
table{border-collapse:collapse;font-size:14px;width:100%}th,td{text-align:left;padding:7px;border-bottom:1px solid #e2e9f1}th{font-weight:600}
details{margin-top:16px}summary{cursor:pointer;color:#315dcc}#status{margin:12px 0}#changes{color:#32465c}
@media(max-width:600px){body{padding:0 12px}section{padding:16px}}
</style>
<h1>Specification loop evaluation</h1>
<div class="controls"><label for="task">Task</label><select id="task"></select></div>
<section><h2>Passes by evaluation category</h2>
<p>Counts use saved judge verdicts. Hover over a point for its count. Toggle categories below.</p>
<div class="chart"><svg id="chart" viewBox="0 0 1100 360" role="img" aria-label="Category passes by revision"></svg></div>
<div id="legend"></div><details><summary>Show exact counts</summary><div id="counts"></div></details></section>
<section><h2>Input specifications</h2><div class="controls">
<button id="previous">Previous</button><label for="revision">Revision</label><select id="revision"></select><button id="next">Next</button>
<label><input id="diff" type="checkbox"> Show changes from previous revision</label></div>
<p id="status"></p><pre id="spec"></pre></section>
<script id="data" type="application/json">{"criteria": {"patch_and_checks": "Patch applies and the recorded executable checks pass.", "file_location": "Code is placed in the required existing module or component.", "api_contract": "API names, visibility, parameters, types, and return contracts match requirements.", "dependency_direction": "Imports and dependency directions respect existing boundaries.", "extension_registration": "Required registration and interface implementation are present.", "approved_dependencies": "No unapproved dependencies are introduced.", "architectural_fit": "Responsibilities belong in the intended layer or component.", "extension_point_adherence": "Existing extension mechanisms are used rather than a parallel path.", "abstraction_integrity": "Domain, transport, persistence, and framework boundaries are preserved.", "convention_fit": "Validation, errors, naming, logging, and tests match analogous local code.", "requirement_intent": "The feature satisfies its behavioral intent and constraints."}, "tasks": [{"name": "mwaskom__seaborn-3063", "revisions": [{"number": 0, "spec": "Add Perc stat for computing percentiles\n\n```python\n(\n    so.Plot(tips, \"day\", \"total_bill\")\n    .add(so.Dot(), so.Perc(11))\n    .add(so.Range(linewidth=3), so.Perc([10, 90]), so.Shift(x=.1))\n)\n```\n\u003cimg width=500 src=\"https://user-images.githubusercontent.com/315810/194721740-2d8b2849-49d6-4d12-9c6f-c94e95246e9b.png\" />\n", "counts": {"patch_and_checks": 0, "file_location": 10, "api_contract": 0, "dependency_direction": 10, "extension_registration": 10, "approved_dependencies": 10, "architectural_fit": 9, "extension_point_adherence": 10, "abstraction_integrity": 10, "convention_fit": 0, "requirement_intent": 0}, "judged": 10, "passes": 0, "complete": true, "changes": ""}, {"number": 1, "spec": "## Goals\n\nAdd `Perc`, a statistical transformation that replaces observations along the value axis with requested percentile values. It must compose with the seaborn objects plotting API and preserve the percentile levels as data so they can be used by later plot processing.\n\n## Workflows\n\nA caller can pass `Perc` as the statistical transform for a plot layer. For each applicable group, compute all requested percentiles of the value-axis variable. Use the existing orientation and grouping conventions so the same behavior works when either axis is the value axis and when grouping variables are present.\n\n## Data model\n\nFor every requested percentile, return a row containing the computed value in the value-axis column and its percentile level in a column named `percentile`. Preserve grouping-variable columns on the corresponding rows. Return one row per requested percentile per group; do not collapse the results to a single estimate or an interval row.\n\n## API contracts\n\nExpose `Perc` with the public parameters `k` and `method`. The default `k` is 5 and the default `method` is `linear`. An integer `k` specifies the number of evenly spaced percentile levels from 0 through 100; an explicit list of numbers specifies the percentile levels to compute. Pass the selected interpolation method through to percentile computation, supporting the methods accepted by NumPy. Preserve the Stat call contract: the transform receives the data, the supplied `GroupBy`, the orientation, and scales, and returns a DataFrame.\n\n## Module architecture\n\nImplement `Perc` in `seaborn._stats.order` alongside order-statistics functionality, and export it from `seaborn.objects`. Keep percentile computation in the statistics layer; do not turn this operation into the aggregation-layer estimate or interval behavior.\n\n## Implementation constraints\n\nSubclass the existing `Stat` abstraction and declare that orientation participates in grouping. Select the value variable using the established orientation mapping, then delegate group handling to the supplied `GroupBy.apply` operation. Within each group, compute percentile values after dropping missing observations. Use NumPy percentile behavior, retaining compatibility with versions that use the older interpolation parameter name as well as versions that use the method parameter name. Keep the transform stateless beyond its declared parameters and do not add dependencies.\n\n## Naming\n\nUse `Perc`, `k`, `method`, and `percentile` for the public class, percentile specification, interpolation selection, and output coordinate respectively.\n\n## Validation\n\nTreat the documented `k` forms as distinct inputs: integer counts generate evenly spaced levels, while lists are used as the explicit levels. Do not reinterpret an integer as a percentile value or restrict explicit lists to pairs. Use a method supported by the installed NumPy percentile API; do not introduce validation behavior that conflicts with that API.\n\n## Documentation\n\nDocument `k` and `method`, including the integer-count and explicit-list meanings, the default values, and that `method` selects percentile interpolation. Follow the local Stat documentation style.\n\n## Compatibility\n\nKeep `Perc` importable from `seaborn._stats.order` and available through `seaborn.objects`; these locations are part of the feature contract.\n\n## Behavioral acceptance criteria\n\nFor integer `k`, produce that many evenly spaced percentile levels from 0 to 100, inclusive. For an explicit list, produce the requested levels in that order. Compute each value using the selected interpolation method after excluding missing observations. Apply the operation independently to each group and to the value variable selected by orientation. Include the corresponding percentile coordinate on every output row.\n\n## Test requirements\n\nCover integer-count and explicit-list behavior, interpolation selection, both orientations, grouped data, and missing observations. Keep tests consistent with existing statistics tests and ensure the feature can be imported from both its statistics module and `seaborn.objects`.\n", "cou pattern, including an Examples section whose usage material is maintained in the objects-stat documentation source. Include usage that demonstrates the default, integer, and explicit-list forms and combining the transform with a range mark. Register `Perc` in the public objects API reference\u2019s Stat objects listing and add a feature entry to the current release notes.\n\n## Compatibility\n\nPreserve the public import locations `seaborn._stats.order` and `seaborn.objects`. Keep compatibility with NumPy versions that use either percentile keyword name.\n\n## Behavioral acceptance criteria\n\nFor integer `k`, produce that many evenly spaced percentile levels from 0 to 100, inclusive. For an explicit list, compute the requested levels in their supplied order. Compute values using the selected interpolation method after excluding missing observations. Apply the operation independently to each observed group and to the value variable selected by orientation. Include the corresponding percentile coordinate on every output row.\n\n## Test requirements\n\nCover integer-count and explicit-list behavior, interpolation selection, both orientations, grouped data, missing observations, public imports, and composition with the objects plotting API. Follow local statistics-test organization, using fixture and test classes consistent with neighboring and reference order-statistics tests.\n", "counts": {"patch_and_checks": 10, "file_location": 10, "api_contract": 10, "dependency_direction": 10, "extension_registration": 10, "approved_dependencies": 10, "architectural_fit": 10, "extension_point_adherence": 10, "abstraction_integrity": 10, "convention_fit": 10, "requirement_intent": 10}, "judged": 10, "passes": 10, "complete": true, "changes": "--- Previous specification\n+++ revision-02\n@@ -1,47 +1,53 @@\n ## Goals\n \n-Add `Perc`, a statistical transformation that replaces observations along the value axis with requested percentile values. It must compose with the seaborn object <script>
const data=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id), keys=Object.keys(data.criteria);
const colors=['#275dcc','#c43e45','#258044','#9b4eaf','#c07800','#147f91','#745337','#d04c93','#697820','#565cba','#53677b'];
const visible=new Set(keys);let task;
const label=key=>key.replaceAll('_',' ').replace(/^./,c=>c.toUpperCase());
function svg(tag,attrs={},text){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;return el;}
function draw(){
 const chart=$('chart');chart.replaceChildren();const rows=task.revisions;
 const maxY=Math.max(10,...rows.map(r=>r.judged)),first=rows[0].number,last=rows.at(-1).number;
 const x=n=>75+(last===first?465:(n-first)/(last-first)*930),y=n=>300-n/maxY*260;
 for(let n=0;n<=maxY;n++){const yy=y(n);chart.append(svg('line',{x1:75,x2:1005,y1:yy,y2:yy,stroke:'#e2e9f1'}),svg('text',{x:60,y:yy+4,'text-anchor':'end'},n));}
 chart.append(svg('text',{x:75,y:20},'Number of passes'),svg('text',{x:540,y:353,'text-anchor':'middle'},'Revision'));
 for(const r of rows)chart.append(svg('text',{x:x(r.number),y:324,'text-anchor':'middle'},r.number));
 keys.forEach((key,i)=>{if(!visible.has(key))return;
  // Partial batches are hollow points, so fewer judgments stay visible.
  chart.append(svg('polyline',{points:rows.filter(r=>r.judged).map(r=>`${x(r.number)},${y(r.counts[key])}`).join(' '),fill:'none',stroke:colors[i],'stroke-width':2}));
  for(const r of rows){if(!r.judged)continue;const dot=svg('circle',{cx:x(r.number),cy:y(r.counts[key]),r:4,stroke:colors[i],fill:r.complete?colors[i]:'white','stroke-width':2});
   dot.append(svg('title',{},`${label(key)} — revision ${r.number}: ${r.counts[key]}/${r.judged} judged runs${r.complete?'':' (partial batch)'}`));chart.append(dot);}
 });
}
function showSpec(){const index=Number($('revision').value),r=task.revisions[index];
 $('spec').textContent=$('diff').checked?(r.changes|| (index===0?'Baseline: no previous specification.':'No changes.')):r.spec;
 $('status').textContent=`Revision ${r.number}: ${r.passes}/${r.judged} judged runs pass every category. ${r.complete?'Batch complete.':'Batch incomplete; counts include only saved judgments.'}`;
 $('previous').disabled=index===0;$('next').disabled=index===task.revisions.length-1;
}
function selectTask(){task=data.tasks[Number($('task').value)];
 $('revision').replaceChildren(...task.revisions.map((r,i)=>new Option(`Revision ${r.number}${r.complete?'':' (partial)'}`,i)));
 const table=document.createElement('table'),head=table.createTHead().insertRow();
 for(const text of ['Revision','Judged',...keys.map(label)]){const cell=document.createElement('th');cell.textContent=text;head.append(cell);}
 for(const r of task.revisions){const row=table.insertRow();for(const value of [r.number,r.judged,...keys.map(k=>r.counts[k])])row.insertCell().textContent=value;}
 $('counts').replaceChildren(table);draw();showSpec();
}
data.tasks.forEach((t,i)=>$('task').add(new Option(t.name,i)));
keys.forEach((key,i)=>{const row=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=true;
 const swatch=document.createElement('span');swatch.className='swatch';swatch.style.background=colors[i];row.append(check,swatch,document.createTextNode(label(key)));row.title=data.criteria[key];
 check.onchange=()=>{check.checked?visible.add(key):visible.delete(key);draw();};$('legend').append(row);});
$('task').onchange=selectTask;$('revision').onchange=showSpec;$('diff').onchange=showSpec;
$('previous').onclick=()=>{$('revision').selectedIndex--;showSpec();};$('next').onclick=()=>{$('revision').selectedIndex++;showSpec();};selectTask();
</script></html>
