nting with a new directive means that if a user is currently using `type` in their code, but they're documenting it using the workaround of documenting it as an assignment (eg. `.. py:data:: Url\\n   :type: TypeAlias\\n   :value: str`), the user will likely want to update their documentation to use this new directive. I'm assuming that the number of users using `type` in their code is quite low, and therefore this trade off seemed worth it.\n- I've chosen to name the directive and role \"type\" because that's also the keyword used to define a type alias in Python. I considered using \"typealias\", \"alias\", or some thing similar, but it seemed safer to choose the same word used in Python syntax because CPython may change the usage of the `type` keyword in the future to define more than just type aliases.\n  - This overlaps with the `:type:` field, which potentially makes understanding rST syntax more confusing for users who are learning rST for the first time. But this trade-off seemed worth it.\n- I've chosen to have users specify the type being aliased in a `:value:` option, rather than in the signature (eg. `.. py:type:: MyAlias = int`), because this is consistent with how the `data` and `attribute` directives work. So I think it makes the syntax more intuitive for users.\n- I've chosen to make specifying a value of the alias optional because there could be cases where a user wants to declare the alias, but not make the type that is aliased public. For example:\n  ```python\n  type MyAlias = str\n\n  def generate() -> MyAlias:\n      ...\n  def accept(arg: MyAlias) -> None:\n     ...\n\n  # To be used like the following:\n  accept(generate())\n  ```\n\n  In the above example, a user may want to allow users to pass this type between parts of the API, without letting the user do anything else with instance of `MyAlias`, by not documenting what `MyAlias` is aliased from. So the user would document this as follows:\n\n  ```rst\n  .. py:type:: MyAlias\n\n  .. py:function:: generate() -> MyAlias\n\n  .. py:function:: accept(arg: MyAlias) -> None\n  ```\n\n  Users can currently do something similar with classes, where they might define a class but not document any of the attributes on it.\n\n  ```rst\n  .. py:class:: MyClass\n\n  .. py:function:: generate() -> MyClass\n\n  .. py:function:: accept(arg: MyClass) -> None\n  ```\n\n- I've chosen to name the option \"value\" because this is consistent with the `data` and `attribute` directives. In addition, this is the terminology used in `typing.TypeAliasType` and in the ast node.\n\n  ```pycon\n  >>> import ast\n  >>> class A:\n  ...     type MyAlias = int\n  ...\n  >>> type(A.MyAlias)\n  \u003cclass 'typing.TypeAliasType'>\n  >>> A.MyAlias.__value__  # Note the attribute name \"__value__\"\n  \u003cclass 'int'>\n  >>> m = ast.parse(\"type PuzzleInput = list[tuple[list[str], int]]\")\n  >>> m.body[0].value  # Note the attribute name \"value\"\n  \u003cast.Subscript object at 0x7dd5ba91afd0>\n  ```\n\n### Relates\n- Closes #7896\n\n\n", "counts": {"patch_and_checks": 0, "file_location": 10, "api_contract": 0, "dependency_direction": 10, "extension_registration": 10, "approved_dependencies": 10, "architectural_fit": 10, "extension_point_adherence": 1, "abstraction_integrity": 10, "convention_fit": 7, "requirement_intent": 0}, "judged": 10, "passes": 0, "complete": true, "changes": ""}, {"number": 1, "spec": "### Goals\nAdd Python-domain support for documenting type aliases and linking to them, including aliases declared at module and nested scopes.\n\n### Scope\nSupport the `py:type` directive and `py:type` cross-reference role. The alias expression is optional. Do not use the variable directive\u2019s `value` option as the alias-expression contract.\n\n### Terminology\nA type alias is a Python-domain object with object type `type alias`. The directive\u2019s optional `canonical` option supplies the displayed alias expression. The `py:type` role links to a documented alias.\n\n### Wor <script>
const data=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id), keys=Object.keys(data.criteria);
const colors=['#275dcc','#c43e45','#258044','#9b4eaf','#c07800','#147f91','#745337','#d04c93','#697820','#565cba','#53677b'];
const visible=new Set(keys);let task;
const label=key=>key.replaceAll('_',' ').replace(/^./,c=>c.toUpperCase());
function svg(tag,attrs={},text){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;return el;}
function draw(){
 const chart=$('chart');chart.replaceChildren();const rows=task.revisions;
 const maxY=Math.max(10,...rows.map(r=>r.judged)),first=rows[0].number,last=rows.at(-1).number;
 const x=n=>75+(last===first?465:(n-first)/(last-first)*930),y=n=>300-n/maxY*260;
 for(let n=0;n<=maxY;n++){const yy=y(n);chart.append(svg('line',{x1:75,x2:1005,y1:yy,y2:yy,stroke:'#e2e9f1'}),svg('text',{x:60,y:yy+4,'text-anchor':'end'},n));}
 chart.append(svg('text',{x:75,y:20},'Number of passes'),svg('text',{x:540,y:353,'text-anchor':'middle'},'Revision'));
 for(const r of rows)chart.append(svg('text',{x:x(r.number),y:324,'text-anchor':'middle'},r.number));
 keys.forEach((key,i)=>{if(!visible.has(key))return;
  // Partial batches are hollow points, so fewer judgments stay visible.
  chart.append(svg('polyline',{points:rows.filter(r=>r.judged).map(r=>`${x(r.number)},${y(r.counts[key])}`).join(' '),fill:'none',stroke:colors[i],'stroke-width':2}));
  for(const r of rows){if(!r.judged)continue;const dot=svg('circle',{cx:x(r.number),cy:y(r.counts[key]),r:4,stroke:colors[i],fill:r.complete?colors[i]:'white','stroke-width':2});
   dot.append(svg('title',{},`${label(key)} — revision ${r.number}: ${r.counts[key]}/${r.judged} judged runs${r.complete?'':' (partial batch)'}`));chart.append(dot);}
 });
}
function showSpec(){const index=Number($('revision').value),r=task.revisions[index];
 $('spec').textContent=$('diff').checked?(r.changes|| (index===0?'Baseline: no previous specification.':'No changes.')):r.spec;
 $('status').textContent=`Revision ${r.number}: ${r.passes}/${r.judged} judged runs pass every category. ${r.complete?'Batch complete.':'Batch incomplete; counts include only saved judgments.'}`;
 $('previous').disabled=index===0;$('next').disabled=index===task.revisions.length-1;
}
function selectTask(){task=data.tasks[Number($('task').value)];
 $('revision').replaceChildren(...task.revisions.map((r,i)=>new Option(`Revision ${r.number}${r.complete?'':' (partial)'}`,i)));
 const table=document.createElement('table'),head=table.createTHead().insertRow();
 for(const text of ['Revision','Judged',...keys.map(label)]){const cell=document.createElement('th');cell.textContent=text;head.append(cell);}
 for(const r of task.revisions){const row=table.insertRow();for(const value of [r.number,r.judged,...keys.map(k=>r.counts[k])])row.insertCell().textContent=value;}
 $('counts').replaceChildren(table);draw();showSpec();
}
data.tasks.forEach((t,i)=>$('task').add(new Option(t.name,i)));
keys.forEach((key,i)=>{const row=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=true;
 const swatch=document.createElement('span');swatch.className='swatch';swatch.style.background=colors[i];row.append(check,swatch,document.createTextNode(label(key)));row.title=data.criteria[key];
 check.onchange=()=>{check.checked?visible.add(key):visible.delete(key);draw();};$('legend').append(row);});
$('task').onchange=selectTask;$('revision').onchange=showSpec;$('diff').onchange=showSpec;
$('previous').onclick=()=>{$('revision').selectedIndex--;showSpec();};$('next').onclick=()=>{$('revision').selectedIndex++;showSpec();};selectTask();
</script></html>
