mputed at requested percentiles, preserving the percentile level alongside each computed value.\n\nScope\n\nThe feature belongs in the statistics ordering module, `seaborn._stats.order`, and must be available from the public `seaborn.objects` namespace. It composes as a `Stat` transform in `Plot.add`.\n\nWorkflows\n\nCallers can use `Perc` as a plot-layer statistical transform. For each group, it computes the requested percentiles from the value variable selected by the plot orientation and returns the percentile results for downstream marks. Grouping and combination of group results use the existing `GroupBy` behavior.\n\nData model\n\nThe result has one row for each requested percentile in each group. Each row includes the computed value in the oriented value column and the corresponding level in a `percentile` column. It is a percentile transformation, not a single summary estimate or a min/max interval.\n\nAPI contracts\n\nThe public statistic is named `Perc`. Its `k` parameter accepts either an integer count or a list of floating-point percentile levels and defaults to 5. An integer requests that many evenly spaced levels from 0 through 100, inclusive; for example, 5 requests 0, 25, 50, 75, and 100. A list requests those levels directly. Its `method` parameter is a string selecting NumPy percentile interpolation behavior and defaults to `linear`. The statistic follows the existing `Stat` call contract, receiving the data frame, `GroupBy`, orientation, and scale mapping, and returning a data frame.\n\nModule architecture\n\nDefine `Perc` in `seaborn._stats.order`, alongside ordering statistics. Export it from `seaborn.objects` by importing it from that module. Keep it as a `Stat` subclass; do not implement percentile behavior as an aggregation statistic in `seaborn._stats.aggregation`.\n\nImplementation constraints\n\nMark the statistic as grouping by orientation. For horizontal orientation, compute percentiles of the x value column; for vertical orientation, co plicit list, return one result per listed level. Honor the requested interpolation method. Work with either orientation and with grouped data, preserving group labels. Ignore missing observations when computing percentiles. Results must represent percentile rows rather than a point estimate or interval.\n\nTest requirements\n\nCheck integer and explicit-list inputs, orientation, interpolation method, grouped data, and missing observations. Verify that both the statistics-module import path and the `seaborn.objects` export work, and that the statistic remains usable through the existing `Plot.add` transform workflow.\n", "label": "Revision 1", "words": 645, "counts": {"patch_and_checks": 9, "file_location": 10, "api_contract": 9, "dependency_direction": 10, "extension_registration": 10, "approved_dependencies": 10, "architectural_fit": 10, "extension_point_adherence": 9, "abstraction_integrity": 10, "convention_fit": 5, "requirement_intent": 9}, "judged": 10, "passes": 5, "complete": true, "changes": "--- Previous specification\n+++ revision-01\n@@ -1,10 +1,59 @@\n-Add Perc stat for computing percentiles\n+Goals\n \n-```python\n-(\n-    so.Plot(tips, \"day\", \"total_bill\")\n-    .add(so.Dot(), so.Perc(11))\n-    .add(so.Range(linewidth=3), so.Perc([10, 90]), so.Shift(x=.1))\n-)\n-```\n-\u003cimg width=500 src=\"https://user-images.githubusercontent.com/315810/194721740-2d8b2849-49d6-4d12-9c6f-c94e95246e9b.png\" />\n+Add `Perc`, a statistical transformation for the seaborn objects interface. It replaces observations with values computed at requested percentiles, preserving the percentile level alongside each computed value.\n+\n+Scope\n+\n+The feature belongs in the statistics ordering module, `seaborn._stats.order`, and must be available from the public `seaborn.objects` namespace. It composes as a `Stat` transform in `Plot.add`.\n+\n+Workflows\n+\n+Callers can use `Perc` as a plot-layer statistical transform. For each group, it computes the requested percentiles f e opposite the plot orientation and returns the percentile results for downstream marks. Group formation, result combination, and group ordering follow the existing `GroupBy` behavior.\n\n## Data model\n\nReturn one row for each requested percentile in each group. Each row contains the computed value in the value column opposite the orientation and its level in a `percentile` column. Preserve grouping columns and their labels in the combined result. Percentile values may be floating-point values, including when the source observations are integers; consumers and tests must not require integer result dtypes. This is a percentile transformation, not a single summary estimate or a min/max interval.\n\n## API contracts\n\nThe public statistic is named `Perc`. Its `k` parameter accepts either an integer count or a list of percentile levels and defaults to 5. An integer requests that many evenly spaced levels from 0 through 100, inclusive. A list supplies the requested levels directly. Its `method` parameter selects NumPy percentile interpolation behavior and defaults to `linear`. The statistic follows the existing `Stat` call contract, receiving a data frame, `GroupBy`, orientation, and scale mapping, and returning a data frame.\n\n## Module architecture\n\nDefine `Perc` in `seaborn._stats.order`, alongside ordering statistics. Export it from `seaborn.objects` by importing it from that module. Keep it as a `Stat` subclass; percentile behavior belongs in the statistics layer, not in `seaborn._stats.aggregation`.\n\n## Implementation constraints\n\nMark the statistic as grouping by orientation. The orientation identifies the independent axis; calculate percentiles from the opposite, value axis: horizontal orientation uses the y variable, and vertical orientation uses the x variable. Apply the data-frame-to-data-frame percentile operation through `GroupBy.apply`, which combines results with group labels and the established group ordering. Preserve those grouping columns in the returned data; do not discard them after applying the groups. Exclude missing values from the values used for percentile computation. Preserve the requested percentile levels in the returned `percentile` column.\n\n## Dependencies\n\nUse the existing NumPy, pandas, `GroupBy`, `Scale`, and `Stat` abstractions. Preserve NumPy compatibility by using its `interpolation` percentile keyword before version 1.22.0 and its `method` keyword from version 1.22.0 onward.\n\n## Naming\n\nUse the public name `Perc` and parameter names `k` and `method`. Use `percentile` as the result column for percentile levels.\n\n## Validation\n\nSupport the integer-count and explicit-list forms for `k`; do not add validation beyond the behavior of the established percentile operation. Pass the selected `method` through to NumPy percentile calculation. Do not impose interval-only list-length restrictions.\n\n## Error handling\n\nPreserve exceptions raised by the percentile operation for unsupported inputs or methods. Preserve grouping keys when combining results so downstream plotting receives the coordinates and grouping data it needs.\n\n## Documentation\n\nDocument that an integer `k` means an evenly spaced count of percentiles from 0 through 100, while a list specifies levels directly. Document `method` as the interpolation choice and describe the percentile-row output, including that computed values may be floating point.\n\n## Compatibility\n\nKeep the `seaborn._stats.order.Perc` import path available as well as the `seaborn.objects.Perc` public export. Support the NumPy percentile keyword conventions on both sides of the 1.22.0 version boundary.\n\n## Behavioral acceptance criteria\n\nFor an integer count, return that many evenly spaced percentile levels, including 0 and 100, with computed values and matching `percentile` entries. For an explicit list, return one result per listed level. Honor the requested interpolation method. Work with either orientation by computing from the oppos ging percentile output wording or percentile calculation resolves the exception.\n"}, {"number": 5, "spec": "## Goals\nAdd Perc, a statistical transformation for the seaborn objects interface. It replaces observations with values computed at requested percentiles and records each requested percentile level with its computed value.\n\n## Scope\nDefine Perc in seaborn._stats.order, export it through seaborn.objects, and make it usable as a Stat in the existing Plot.add workflow. Document the public statistic, including usage examples, in the API documentation and release notes.\n\n## Workflows\nCallers can apply Perc to a plot layer. For each group supplied by the Stat workflow, it computes percentiles of the value variable opposite the plot orientation and returns rows for downstream marks. Group formation and result ordering follow the supplied GroupBy behavior, including the orientation grouping and any additional grouping variables chosen by the plot workflow.\n\n## Data model\nReturn one row per requested percentile in each group. Each result row contains the computed value in the value column opposite the orientation and the requested level in a percentile column. Retain grouping columns and their group labels when GroupBy combines results. Do not require every non-grouping input column or original coordinate to appear in the result: GroupBy.apply combines the columns returned by the per-group transformation with the grouping keys. Computed values may be floating point, including when source observations are integers. This transformation returns percentile rows, not a single summary estimate or a min/max interval.\n\n## API contracts\nThe public statistic is named Perc. Its k parameter accepts either an integer count or a list of percentile levels and defaults to 5. An integer requests that many evenly spaced levels from 0 through 100, inclusive; a list supplies levels directly. Its method parameter is a string selecting NumPy percentile behavior and defaults to he orientation variable among the grouping variables when this statistic declares orientation grouping; consequently, distinct orientation values may form distinct groups. Exclude missing values from the observations used for percentile computation. Preserve requested percentile levels in the result. Accept the scales mapping required by the Stat contract.\n\n## Dependencies\nUse the existing NumPy, pandas, GroupBy, Scale, Stat, and version abstractions. Preserve NumPy compatibility by using its interpolation percentile keyword before version 1.22.0 and its method keyword from version 1.22.0 onward.\n\n## Naming\nUse the public name Perc and parameter names k and method. Use percentile as the result column for percentile levels.\n\n## Validation\nSupport the integer-count and explicit-list forms for k. Pass the selected method through to NumPy percentile calculation and preserve the percentile operation's behavior for unsupported inputs or methods. Do not impose interval-only restrictions on list length or add validation that changes the established percentile operation.\n\n## Error handling\nAllow exceptions from the percentile operation for unsupported inputs or methods to propagate.\n\n## Documentation\nDocument Perc's parameters and percentile-row output. Explain that integer k requests evenly spaced levels from 0 through 100, while a list supplies levels directly. Describe method as the NumPy percentile choice, with linear as the default, and identify all valid choices: inverted_cdf, averaged_inverted_cdf, closest_observation, interpolated_inverted_cdf, hazen, weibull, linear, median_unbiased, normal_unbiased, lower, higher, midpoint, and nearest. Include public usage examples showing the default quartiles and endpoints, an integer count, an explicit list, and combining percentile output with a range mark to show an interval. Add Perc to the public Stat objects autosummary in doc/api.rst and add a feature entry for objects.Perc to the v0.12.1 release notes.\n\n p. Each row contains the computed value in the value column and its level in percentile. GroupBy combines those columns with grouping keys and labels; unrelated input columns and original coordinates need not survive. Values may be floating point even when inputs are integers. Output is percentile rows, not a point estimate or interval.\n\n## API contracts\nThe public class is Perc, with k defaulting to 5 and accepting an integer count or a list of levels. An integer requests evenly spaced levels from 0 through 100 inclusive; a list supplies levels directly. The method string selects NumPy percentile behavior and defaults to linear. Implement the Stat call contract: accept data, GroupBy, orientation, and a mapping of variables to Scale objects; return a data frame.\n\n## Module architecture\nDefine Perc beside the ordering statistics in seaborn._stats.order and export it from seaborn.objects. Keep computation in the statistics layer as a Stat subclass; do not implement it as an aggregation or standalone plotting operation.\n\n## Implementation constraints\nDeclare orientation grouping. The orientation is the independent axis, so compute on the opposite value axis: horizontal uses y and vertical uses x. Use GroupBy.apply for the per-group data-frame transform so its labels, column arrangement, and established ordering are retained. Plot's Stat dispatcher then includes orientation among grouping variables, so distinct orientation values may form separate groups. Exclude missing observations from percentile computation, preserve requested levels, and accept the Stat-required scales mapping.\n\n## Dependencies\nUse existing NumPy, pandas, GroupBy, Scale, Stat, and Version abstractions; add no dependencies. For NumPy before 1.22.0 use the interpolation percentile keyword; from 1.22.0 use method.\n\n## Naming\nUse the public name Perc, parameters k and method, and percentile for the level column.\n\n## Validation\nSupport integer counts and explicit lists; pass method to low, and therefore this trade off seemed worth it.\n- I've chosen to name the directive and role \"type\" because that's also the keyword used to define a type alias in Python. I considered using \"typealias\", \"alias\", or some thing similar, but it seemed safer to choose the same word used in Python syntax because CPython may change the usage of the `type` keyword in the future to define more than just type aliases.\n  - This overlaps with the `:type:` field, which potentially makes understanding rST syntax more confusing for users who are learning rST for the first time. But this trade-off seemed worth it.\n- I've chosen to have users specify the type being aliased in a `:value:` option, rather than in the signature (eg. `.. py:type:: MyAlias = int`), because this is consistent with how the `data` and `attribute` directives work. So I think it makes the syntax more intuitive for users.\n- I've chosen to make specifying a value of the alias optional because there could be cases where a user wants to declare the alias, but not make the type that is aliased public. For example:\n  ```python\n  type MyAlias = str\n\n  def generate() -> MyAlias:\n      ...\n  def accept(arg: MyAlias) -> None:\n     ...\n\n  # To be used like the following:\n  accept(generate())\n  ```\n\n  In the above example, a user may want to allow users to pass this type between parts of the API, without letting the user do anything else with instance of `MyAlias`, by not documenting what `MyAlias` is aliased from. So the user would document this as follows:\n\n  ```rst\n  .. py:type:: MyAlias\n\n  .. py:function:: generate() -> MyAlias\n\n  .. py:function:: accept(arg: MyAlias) -> None\n  ```\n\n  Users can currently do something similar with classes, where they might define a class but not document any of the attributes on it.\n\n  ```rst\n  .. py:class:: MyClass\n\n  .. py:function:: generate() -> MyClass\n\n  .. py:function:: accept(arg: MyClass) -> None\n  ```\n\n- I've chosen to name the option \"value\" because this is consistent with the `data` and `attribute` directives. In addition, this is the terminology used in `typing.TypeAliasType` and in the ast node.\n\n  ```pycon\n  >>> import ast\n  >>> class A:\n  ...     type MyAlias = int\n  ...\n  >>> type(A.MyAlias)\n  \u003cclass 'typing.TypeAliasType'>\n  >>> A.MyAlias.__value__  # Note the attribute name \"__value__\"\n  \u003cclass 'int'>\n  >>> m = ast.parse(\"type PuzzleInput = list[tuple[list[str], int]]\")\n  >>> m.body[0].value  # Note the attribute name \"value\"\n  \u003cast.Subscript object at 0x7dd5ba91afd0>\n  ```\n\n### Relates\n- Closes #7896\n\n\n", "label": "Revision 0", "words": 594, "counts": {"patch_and_checks": 0, "file_location": 10, "api_contract": 0, "dependency_direction": 10, "extension_registration": 9, "approved_dependencies": 10, "architectural_fit": 6, "extension_point_adherence": 2, "abstraction_integrity": 10, "convention_fit": 4, "requirement_intent": 0}, "judged": 10, "passes": 0, "complete": true, "changes": ""}, {"number": 1, "spec": "## Goals\nAdd Python-domain support for documenting type aliases and referring to them through the existing Python cross-reference system. Preserve the domain\u2019s existing object handling and registration conventions.\n\n## Workflows\nA document can declare a type alias at module level or within a class context. Its alias expression is optional. When supplied through the `canonical` option, render it as part of the signature and parse it as a Python annotation so referenced types participate in normal cross-reference resolution. A declaration without an expression still documents and indexes the alias.\n\n## Data model\nTreat each alias as a Python-domain object with the `type` object type. Register its qualified name as the primary object. When `canonical` is present, also register that name as an aliased target for the same object.\n\n## API contracts\nProvide the `py:type` directive and the `py:type` cross-reference role. The directive accepts the shared `PyObject` options, including `canonical`; do not substitute a `value` option or add variable-specific options. The signature begins with the type-alias prefix. The optional canonical expression follows the alias name, is parsed by the existing annotation parser, and retains its annotation structure and cross-reference nodes. The role resolves aliases through the Python domain\u2019s normal object lookup.\n\n## Module architecture\nImplement the alias object in the existing Python-domain component as a `PyObject` specialization, and register it in the domain\u2019s object types, directives, and roles. Use the inherited Python-object signature and target handling, including module and class context, indexing hooks, and canonical alias registration. Do not implement it as a variable specialization or create a separate rendering or cross-reference path.\n\n## Naming\nUse `type` for the Python-domain object type, directive, and role, and `canonical` for the optional alias expression. Use type-alias terminology in user-visible index entries.\n\n## Behavioral acceptance criteria\n- Module-level and class-scoped aliases are documented with the correct qualified names and Python-domain cross-references.\n- Omitting `canonical` remains valid and does not prevent documenting or cross-referencing the alias.\n- When present, `canonical` is rendered with a type prefix and its expression is parsed into annotation nodes, allowing referenced types to resolve through normal Python-domain cross-referencing.\n- Index entries identify nested aliases as type aliases in their containing class; module-level aliases use the existing module-aware index convention.\n- Existing Python-domain behavior and shared `PyObject` options remain available.\n\n## Test requirements\nAdd focused regression coverage for the directive and role, including an alias with and without `canonical`, annotation cross-references in the expression, module-level and class-scoped names, and the type-alias index text. Exercise the behavior through the existing Python-domain test conventions; documentation examples alone are insufficient.\n", "label": "Revision 1", "words": 426, "counts": {"patch_and_checks": 2, "file_location": 10, "api_contract": 2, "dependency_direction": 10, "extension_registration": 10, "approved_dependencies": 10, "architectural_fit": 10, "extension_point_adherence": 10, "abstraction_integrity": 10, "convention_fit": 9, "requirement_intent": 2}, "judged": 10, "passes": 1, "complete": true, "changes": "--- Previous specification\n+++ revision-01\n@@ -1,76 +1,27 @@\n-Add py:type directive and role for documenting type aliases\n+## Goals\n+Add Python-domain support for documenting type aliases and referring to them through the existing Python cross-reference system. Preserve the domain\u2019s existing object handling and registration conventions.\n \n-### Feature or Bugfix\n-- Feature\n+## Workflows\n+A document can declare a type alias at module level or within a class context. Its alias expression is optional. When supplied through the `canonical` option, render it as part of the signature and parse it as a Python annotation so referenced types participate in normal cross-reference resolution. A declaration without an expression still documents and indexes the alias.\n \n-### Purpose\n-This pull request adds a `py:type` directive for documenting type aliases (https://typing.readthedocs.io/en/latest/spec/aliases.html#type-aliases), and a `py:type` role for linking to them.\n+## Data model\n+Treat each alias as a Python-domain object with the `type` object type. Register its qualified name as the primary object. When `canonical` is present, also register that name as an aliased target for the same object.\n \n-```rst\n-.. py:type:: Alias1\n-   :value: list[str | int]\n+## API contracts\n+Provide the `py:type` directive and the `py:type` cross-reference role. The directive accepts the shared `PyObject` options, including `canonical`; t module level or within a class context. The alias expression is optional. When supplied through the canonical option, render it after the alias name, separated by an equals sign, and parse it as a Python annotation so referenced types participate in normal cross-reference resolution. A declaration without an expression still documents and indexes the alias. The directive may also contain a description body.\n\n## Data model\nTreat each alias as a Python-domain object with the object type name \u201ctype\u201d. Its public object-type label is \u201ctype alias\u201d, and its cross-reference types include \u201ctype\u201d and \u201cobj\u201d. Register its qualified name as the primary object. When canonical is present, register that name as an aliased target for the same object.\n\n## API contracts\nProvide the py:type directive and the py:type cross-reference role. The directive inherits the shared PyObject options and adds the optional canonical option; do not substitute a value option or add variable-specific options. Its signature begins with the prefix \u201ctype\u201d. When canonical is present, render an equals sign between the alias name and expression, parse the expression with the existing annotation parser, and retain its annotation structure and cross-reference nodes. The role resolves aliases through the Python domain\u2019s normal object lookup.\n\nIndex text follows the Python domain\u2019s existing module-name configuration. A module-level alias uses the module-aware form \u201cAlias (in module example)\u201d when a module is set, and otherwise uses the alias name. A nested alias uses the form \u201cAlias (type alias in example.Class)\u201d; include the module prefix on the containing class when module names are configured.\n\n## Module architecture\nImplement the alias object in the existing Python-domain component as a PyObject specialization, and register its object type, directive, and role in the Python domain. Use inherited Python-object signature and target handling, including module and class context, indexing hooks, and canonical alias registration. Use the existing annotation parser and Python-domain cross-reference machinery; do not create a separate rendering or cross-reference path.\n\n## Naming\nUse \u201ctype\u201d for the Python-domain object type, directive, and role, and \u201ccanonical\u201d for the optional alias expression. Use \u201ctype alias\u201d as the public object-type label and in user-visible index entries for nested aliases.\n\n## Documentation\nDocument the py:type directive and py:type role in the Python-domain documentation. Explain that canonical describes the represented type, is optional, and is rendered in the directive signature. Document that the directive supports an optional description body and describe the alias cross-reference role.\n\n## Behavioral acceptance criteria\n- Module-level and class-scoped aliases are documented with the correct qualified names and Python-domain cross-references.\n- Omitting canonical remains valid and does not prevent documenting or cross-referencing the alias.\n- When present, canonical is rendered after the alias name with an equals sign, and its expression is parsed into annotation nodes so referenced types can resolve through normal Python-domain cross-referencing.\n- Module-level and nested index text follows the reference forms and respects the configured module-name behavior for nested aliases.\n- The public object-type label is \u201ctype alias\u201d, while the object type name and directive and role name are \u201ctype\u201d.\n- Existing Python-domain behavior and shared PyObject options remain available.\n\n## Test requirements\nAdd focused regression coverage for the directive and role, including aliases with and without canonical, annotation cross-references in the expression, module-level and class-scoped names, signature prefix and separator, module-level and nested index text with module-name configuration, object-type labe <script>
const data=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id), keys=Object.keys(data.criteria);
const colors=['#275dcc','#c43e45','#258044','#9b4eaf','#c07800','#147f91','#745337','#d04c93','#697820','#565cba','#53677b'];
const visible=new Set(keys);let task;
const label=key=>key.replaceAll('_',' ').replace(/^./,c=>c.toUpperCase());
const entryLabel=r=>r.label||`Revision ${r.number}`;
function svg(tag,attrs={},text){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;return el;}
function draw(){
 const chart=$('chart');chart.replaceChildren();const rows=task.revisions;
 const maxY=Math.max(10,...rows.map(r=>r.judged)),first=rows[0].number,last=rows.at(-1).number;
 const x=n=>75+(last===first?465:(n-first)/(last-first)*930),y=n=>300-n/maxY*260;
 for(let n=0;n<=maxY;n++){const yy=y(n);chart.append(svg('line',{x1:75,x2:1005,y1:yy,y2:yy,stroke:'#e2e9f1'}),svg('text',{x:60,y:yy+4,'text-anchor':'end'},n));}
 chart.append(svg('text',{x:75,y:20},'Number of passes'),svg('text',{x:540,y:353,'text-anchor':'middle'},'Refinement → accepted simplifications'));
 for(const r of rows)chart.append(svg('text',{x:x(r.number),y:324,'text-anchor':'middle'},r.label||r.number));
 keys.forEach((key,i)=>{if(!visible.has(key))return;
  // Partial batches are hollow points, so fewer judgments stay visible.
  chart.append(svg('polyline',{points:rows.filter(r=>r.judged).map(r=>`${x(r.number)},${y(r.counts[key])}`).join(' '),fill:'none',stroke:colors[i],'stroke-width':2}));
  for(const r of rows){if(!r.judged)continue;const dot=svg('circle',{cx:x(r.number),cy:y(r.counts[key]),r:4,stroke:colors[i],fill:r.complete?colors[i]:'white','stroke-width':2});
   dot.append(svg('title',{},`${label(key)} — ${entryLabel(r)}: ${r.counts[key]}/${r.judged} judged runs${r.complete?'':' (partial batch)'}`));chart.append(dot);}
 });
}
function showSpec(){const index=Number($('revision').value),r=task.revisions[index];
 $('spec').textContent=$('diff').checked?(r.changes|| (index===0?'Baseline: no previous specification.':'No changes.')):r.spec;
 $('status').textContent=`${entryLabel(r)}: ${r.passes}/${r.judged} judged runs pass every category. ${r.words} words. `+(r.complete?'Batch complete.':'Batch incomplete; counts include only saved judgments.');
 $('previous').disabled=index===0;$('next').disabled=index===task.revisions.length-1;
}
function selectTask(){task=data.tasks[Number($('task').value)];
 $('revision').replaceChildren(...task.revisions.map((r,i)=>new Option(`${entryLabel(r)} — ${r.words} words${r.complete?'':' (partial)'}`,i)));
 $('chart-note').textContent='Refinement revisions followed by accepted simplifications. Rejected proposals are omitted. Counts use saved judge verdicts.';
 const table=document.createElement('table'),head=table.createTHead().insertRow();
 for(const text of ['Step','Words','Judged','All pass',...keys.map(label)]){const cell=document.createElement('th');cell.textContent=text;head.append(cell);}
 for(const r of task.revisions){const row=table.insertRow();for(const value of [entryLabel(r),r.words,r.judged,r.passes,...keys.map(k=>r.counts[k])])row.insertCell().textContent=value;}
 $('counts').replaceChildren(table);draw();showSpec();
}
data.tasks.forEach((t,i)=>$('task').add(new Option(t.name,i)));
keys.forEach((key,i)=>{const row=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=true;
 const swatch=document.createElement('span');swatch.className='swatch';swatch.style.background=colors[i];row.append(check,swatch,document.createTextNode(label(key)));row.title=data.criteria[key];
 check.onchange=()=>{check.checked?visible.add(key):visible.delete(key);draw();};$('legend').append(row);});
$('task').onchange=selectTask;$('revision').onchange=showSpec;$('diff').onchange=showSpec;
$('previous').onclick=()=>{$('revision').selectedIndex--;showSpec();};$('next').onclick=()=>{$('revision').selectedIndex++;showSpec();};selectTask();
</script></html>
