serving the percentile level alongside each computed value.\n\nScope\n\nThe feature belongs in the statistics ordering module, `seaborn._stats.order`, and must be available from the public `seaborn.objects` namespace. It composes as a `Stat` transform in `Plot.add`.\n\nWorkflows\n\nCallers can use `Perc` as a plot-layer statistical transform. For each group, it computes the requested percentiles from the value variable selected by the plot orientation and returns the percentile results for downstream marks. Grouping and combination of group results use the existing `GroupBy` behavior.\n\nData model\n\nThe result has one row for each requested percentile in each group. Each row includes the computed value in the oriented value column and the corresponding level in a `percentile` column. It is a percentile transformation, not a single summary estimate or a min/max interval.\n\nAPI contracts\n\nThe public statistic is named `Perc`. Its `k` parameter accepts either an integer count or a list of floating-point percentile levels and defaults to 5. An integer requests that many evenly spaced levels from 0 through 100, inclusive; for example, 5 requests 0, 25, 50, 75, and 100. A list requests those levels directly. Its `method` parameter is a string selecting NumPy percentile interpolation behavior and defaults to `linear`. The statistic follows the existing `Stat` call contract, receiving the data frame, `GroupBy`, orientation, and scale mapping, and returning a data frame.\n\nModule architecture\n\nDefine `Perc` in `seaborn._stats.order`, alongside ordering statistics. Export it from `seaborn.objects` by importing it from that module. Keep it as a `Stat` subclass; do not implement percentile behavior as an aggregation statistic in `seaborn._stats.aggregation`.\n\nImplementation constraints\n\nMark the statistic as grouping by orientation. For horizontal orientation, compute percentiles of the x value column; for vertical orientation, compute percentiles of the y value col lt combination, and group ordering follow the existing `GroupBy` behavior.\n\n## Data model\n\nReturn one row for each requested percentile in each group. Each row contains the computed value in the value column opposite the orientation and its level in a `percentile` column. Preserve grouping columns and their labels in the combined result. Percentile values may be floating-point values, including when the source observations are integers; consumers and tests must not require integer result dtypes. This is a percentile transformation, not a single summary estimate or a min/max interval.\n\n## API contracts\n\nThe public statistic is named `Perc`. Its `k` parameter accepts either an integer count or a list of percentile levels and defaults to 5. An integer requests that many evenly spaced levels from 0 through 100, inclusive. A list supplies the requested levels directly. Its `method` parameter selects NumPy percentile interpolation behavior and defaults to `linear`. The statistic follows the existing `Stat` call contract, receiving a data frame, `GroupBy`, orientation, and scale mapping, and returning a data frame.\n\n## Module architecture\n\nDefine `Perc` in `seaborn._stats.order`, alongside ordering statistics. Export it from `seaborn.objects` by importing it from that module. Keep it as a `Stat` subclass; percentile behavior belongs in the statistics layer, not in `seaborn._stats.aggregation`.\n\n## Implementation constraints\n\nMark the statistic as grouping by orientation. The orientation identifies the independent axis; calculate percentiles from the opposite, value axis: horizontal orientation uses the y variable, and vertical orientation uses the x variable. Apply the data-frame-to-data-frame percentile operation through `GroupBy.apply`, which combines results with group labels and the established group ordering. Preserve those grouping columns in the returned data; do not discard them after applying the groups. Exclude missing values from the values used for percentile computation. Preserve the requested percentile levels in the returned `percentile` column.\n\n## Dependencies\n\nUse the existing NumPy, pandas, `GroupBy`, `Scale`, and `Stat` abstractions. Preserve NumPy compatibility by using its `interpolation` percentile keyword before version 1.22.0 and its `method` keyword from version 1.22.0 onward.\n\n## Naming\n\nUse the public name `Perc` and parameter names `k` and `method`. Use `percentile` as the result column for percentile levels.\n\n## Validation\n\nSupport the integer-count and explicit-list forms for `k`; do not add validation beyond the behavior of the established percentile operation. Pass the selected `method` through to NumPy percentile calculation. Do not impose interval-only list-length restrictions.\n\n## Error handling\n\nPreserve exceptions raised by the percentile operation for unsupported inputs or methods. Preserve grouping keys when combining results so downstream plotting receives the coordinates and grouping data it needs.\n\n## Documentation\n\nDocument that an integer `k` means an evenly spaced count of percentiles from 0 through 100, while a list specifies levels directly. Document `method` as the interpolation choice and describe the percentile-row output, including that computed values may be floating point.\n\n## Compatibility\n\nKeep the `seaborn._stats.order.Perc` import path available as well as the `seaborn.objects.Perc` public export. Support the NumPy percentile keyword conventions on both sides of the 1.22.0 version boundary.\n\n## Behavioral acceptance criteria\n\nFor an integer count, return that many evenly spaced percentile levels, including 0 and 100, with computed values and matching `percentile` entries. For an explicit list, return one result per listed level. Honor the requested interpolation method. Work with either orientation by computing from the opposite value variable, and with grouped data while preserving group columns, labels, and established ordering. Ig terface. It replaces observations with values computed at requested percentiles and records each requested percentile level with its computed value.\n\n## Scope\nDefine Perc in seaborn._stats.order, export it through seaborn.objects, and make it usable as a Stat in the existing Plot.add workflow. Document the public statistic, including usage examples, in the API documentation and release notes.\n\n## Workflows\nCallers can apply Perc to a plot layer. For each group supplied by the Stat workflow, it computes percentiles of the value variable opposite the plot orientation and returns rows for downstream marks. Group formation and result ordering follow the supplied GroupBy behavior, including the orientation grouping and any additional grouping variables chosen by the plot workflow.\n\n## Data model\nReturn one row per requested percentile in each group. Each result row contains the computed value in the value column opposite the orientation and the requested level in a percentile column. Retain grouping columns and their group labels when GroupBy combines results. Do not require every non-grouping input column or original coordinate to appear in the result: GroupBy.apply combines the columns returned by the per-group transformation with the grouping keys. Computed values may be floating point, including when source observations are integers. This transformation returns percentile rows, not a single summary estimate or a min/max interval.\n\n## API contracts\nThe public statistic is named Perc. Its k parameter accepts either an integer count or a list of percentile levels and defaults to 5. An integer requests that many evenly spaced levels from 0 through 100, inclusive; a list supplies levels directly. Its method parameter is a string selecting NumPy percentile behavior and defaults to linear. The statistic follows the existing Stat call contract: it receives a data frame, a GroupBy, an orientation, and a mapping from variables to Scale objects, and returns a data frame.\n\n## Module architecture\nDefine Perc in seaborn._stats.order, alongside the ordering statistics. Export it from seaborn.objects by importing it from that module. Keep percentile computation in the statistics layer as a Stat subclass; do not move it to seaborn._stats.aggregation or implement it as a standalone plotting operation.\n\n## Implementation constraints\nMark the statistic as grouping by orientation. The orientation identifies the independent axis; compute percentiles from the opposite, value axis: horizontal orientation uses y, and vertical orientation uses x. Apply the per-group data-frame transformation through GroupBy.apply so grouping labels, column arrangement, and established group ordering follow the existing GroupBy behavior. In the Plot workflow, the Stat dispatcher includes the orientation variable among the grouping variables when this statistic declares orientation grouping; consequently, distinct orientation values may form distinct groups. Exclude missing values from the observations used for percentile computation. Preserve requested percentile levels in the result. Accept the scales mapping required by the Stat contract.\n\n## Dependencies\nUse the existing NumPy, pandas, GroupBy, Scale, Stat, and version abstractions. Preserve NumPy compatibility by using its interpolation percentile keyword before version 1.22.0 and its method keyword from version 1.22.0 onward.\n\n## Naming\nUse the public name Perc and parameter names k and method. Use percentile as the result column for percentile levels.\n\n## Validation\nSupport the integer-count and explicit-list forms for k. Pass the selected method through to NumPy percentile calculation and preserve the percentile operation's behavior for unsupported inputs or methods. Do not impose interval-only restrictions on list length or add validation that changes the established percentile operation.\n\n## Error handling\nAllow exceptions from the percentile operation for unsupported inputs or methods to propagate. Do not treat downstream plotting property-resolution errors as percentile calculation errors. Plot integration checks must use transformed data and mark properties that provide valid, non-empty inputs to scale and color resolution; an empty array reaching NumPy unit conversion or Matplotlib color conversion is a plotting-input failure, not a reason to alter percentile output semantics.\n\n## Documentation\nDocument Perc's parameters and percentile-row output. Explain that integer k requests evenly spaced levels from 0 through 100, while a list supplies levels directly; describe method as the NumPy percentile choice and identify its valid options. Include public usage examples showing the default quartiles and endpoints, an integer count, an explicit list, and combining percentile output with a range mark to show an interval. Add Perc to the public Stat objects autosummary in doc/api.rst and add a feature entry for objects.Perc to the v0.12.1 release notes.\n\n## Compatibility\nKeep both seaborn._stats.order.Perc and seaborn.objects.Perc available. Support the NumPy percentile keyword conventions on both sides of the 1.22.0 version boundary.\n\n## Behavioral acceptance criteria\nFor an integer count, return that many evenly spaced percentile levels, including 0 and 100, with computed values and matching percentile entries. For an explicit list, return one result per listed level. Honor the selected interpolation method. Work with either orientation by computing from the opposite value variable, and with grouped data while preserving GroupBy-defined grouping labels and ordering. Ignore missing observations during computation. Return the calculated value, percentile level, and grouping keys produced by the GroupBy combination; do not require unrelated source columns to survive. Compose with Plot.add and remain usable by a mark when the plot inputs and properties are valid. Results represent percentile rows rather than a point estimate or interval.\n\n vel column.\n+Use Perc, k, method, and percentile for the level column.\n \n ## Validation\n-Support integer counts and explicit lists; pass method to NumPy and allow unsupported inputs or methods to raise the percentile operation's exceptions. Do not impose interval-only list-length restrictions or other validation that changes percentile behavior.\n-\n-## Error handling\n-Let percentile-operation exceptions propagate.\n+Support integer counts and explicit lists. Pass method through to NumPy and let unsupported values or methods raise percentile-operation exceptions. Do not impose interval-specific list-length restrictions or other validation that changes percentile behavior.\n \n ## Documentation\n-Explain the parameters and percentile-row output, including integer levels from 0 to 100 and explicit lists. Describe method as NumPy's percentile choice, defaulting to linear, and list its valid choices: inverted_cdf, averaged_inverted_cdf, closest_observation, interpolated_inverted_cdf, hazen, weibull, linear, median_unbiased, normal_unbiased, lower, higher, midpoint, nearest. Include examples using the public so namespace for default quartiles and endpoints, an integer count, explicit levels, and combining Perc with a range mark for an interval. Add Perc to the public Stat objects autosummary in doc/api.rst and add an objects.Perc feature entry to the v0.12.1 release notes.\n+Document the parameters and row-per-percentile output. Explain integer levels from 0 to 100 and explicit levels; describe method as NumPy's percentile choice, defaulting to linear, with valid choices inverted_cdf, averaged_inverted_cdf, closest_observation, interpolated_inverted_cdf, hazen, weibull, linear, median_unbiased, normal_unbiased, lower, higher, midpoint, and nearest. Include examples using the public so namespace for default quartiles and endpoints, an integer count, explicit levels, and combining Perc with a range mark to show an interval. Add Perc to the public Stat objects autosumm  values, orientations, methods, grouping/order, missing data, public imports, and Plot.add as appropriate. Choose direct-test grouping variables deliberately because orientation may split groups; assert actual labels and output columns, not unrelated source columns, and import only names used by tests.\n"}, {"number": 6, "label": "R2 C3", "spec": "## Goals\nAdd Perc, a statistical transform for seaborn's objects interface. For each group, it replaces observations with requested percentile values and records each level.\n\n## Scope\nImplement Perc in seaborn._stats.order, export it from seaborn.objects, and support it as a Stat in Plot.add. Document the public statistic in API documentation and release notes.\n\n## Workflows\nCompute percentiles of the value variable opposite the plot orientation for each Stat group. Return rows for downstream marks. Group formation, labels, and ordering follow GroupBy, including plot-selected grouping variables and orientation.\n\n## Data model\nReturn one row per requested level per group, with the computed value in the value column and level in percentile. GroupBy adds grouping keys and labels. Unrelated input columns and original coordinates need not survive. Values may be floating point for integer inputs; output is percentile rows, not a point estimate or interval.\n\n## API contracts\nThe public class is Perc. Parameter k defaults to 5 and accepts an integer count or list of levels. A count requests evenly spaced levels from 0 through 100 inclusive; a list supplies levels directly. Parameter method selects NumPy percentile behavior and defaults to linear. Implement the Stat call contract: receive data, GroupBy, orientation, and a mapping of variables to Scale objects; return a data frame.\n\n## Module architecture\nKeep computation in the statistics layer as a Stat subclass beside ordering statistics. Export Perc through seaborn.objects for Plot.add composition. Do not implement it as an aggregation or standalone plotting oper <script>
const data=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id), keys=Object.keys(data.criteria);
const colors=['#275dcc','#c43e45','#258044','#9b4eaf','#c07800','#147f91','#745337','#d04c93','#697820','#565cba','#53677b'];
const visible=new Set(keys);let task;
const label=key=>key.replaceAll('_',' ').replace(/^./,c=>c.toUpperCase());
const entryLabel=r=>r.label||`Revision ${r.number}`;
function svg(tag,attrs={},text){const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;return el;}
function draw(){
 const chart=$('chart');chart.replaceChildren();const rows=task.revisions;
 const maxY=Math.max(10,...rows.map(r=>r.judged)),first=rows[0].number,last=rows.at(-1).number;
 const x=n=>75+(last===first?465:(n-first)/(last-first)*930),y=n=>300-n/maxY*260;
 for(let n=0;n<=maxY;n++){const yy=y(n);chart.append(svg('line',{x1:75,x2:1005,y1:yy,y2:yy,stroke:'#e2e9f1'}),svg('text',{x:60,y:yy+4,'text-anchor':'end'},n));}
 chart.append(svg('text',{x:75,y:20},'Number of passes'),svg('text',{x:540,y:353,'text-anchor':'middle'},task.simplification?'Round / candidate (evaluation order)':'Revision'));
 for(const r of rows)chart.append(svg('text',{x:x(r.number),y:324,'text-anchor':'middle'},r.label||r.number));
 keys.forEach((key,i)=>{if(!visible.has(key))return;
  // Partial batches are hollow points, so fewer judgments stay visible.
  chart.append(svg('polyline',{points:rows.filter(r=>r.judged).map(r=>`${x(r.number)},${y(r.counts[key])}`).join(' '),fill:'none',stroke:colors[i],'stroke-width':2}));
  for(const r of rows){if(!r.judged)continue;const dot=svg('circle',{cx:x(r.number),cy:y(r.counts[key]),r:4,stroke:colors[i],fill:r.complete?colors[i]:'white','stroke-width':2});
   dot.append(svg('title',{},`${label(key)} — ${entryLabel(r)}: ${r.counts[key]}/${r.judged} judged runs${r.complete?'':' (partial batch)'}`));chart.append(dot);}
 });
}
function showSpec(){const index=Number($('revision').value),r=task.revisions[index];
 $('spec').textContent=$('diff').checked?(r.changes|| (index===0?'Baseline: no previous specification.':'No changes.')):r.spec;
 $('status').textContent=`${entryLabel(r)}: ${r.passes}/${r.judged} judged runs pass every category. `+(task.simplification?`${r.words} words (input: ${r.input_words}). ${r.status}. `:'')+(r.length_rejected?'Not evaluated: outside length bounds.':r.complete?'Batch complete.':'Batch incomplete; counts include only saved judgments.');
 $('previous').disabled=index===0;$('next').disabled=index===task.revisions.length-1;
}
function selectTask(){task=data.tasks[Number($('task').value)];
 $('revision').replaceChildren(...task.revisions.map((r,i)=>new Option(`${entryLabel(r)}${task.simplification?` — ${r.words} words; ${r.status}`:''}${r.complete?'':' (partial)'}`,i)));
 $('chart-note').textContent=task.simplification?'Each point is an independent proposal; lines show evaluation order, not a sequence of accepted edits. R = round; C = candidate. Counts use saved verdicts.':'Counts use saved judge verdicts. Hover over a point for its count. Toggle categories below.';
 $('diff-label').textContent=task.simplification?'Show changes from round input':'Show changes from previous revision';
 const table=document.createElement('table'),head=table.createTHead().insertRow();
 for(const text of ['Evaluation','Judged','All pass',...(task.simplification?['Words','Outcome']:[]),...keys.map(label)]){const cell=document.createElement('th');cell.textContent=text;head.append(cell);}
 for(const r of task.revisions){const row=table.insertRow();for(const value of [entryLabel(r),r.judged,r.passes,...(task.simplification?[r.words,r.status]:[]),...keys.map(k=>r.counts[k])])row.insertCell().textContent=value;}
 $('counts').replaceChildren(table);draw();showSpec();
}
data.tasks.forEach((t,i)=>$('task').add(new Option(t.name,i)));
keys.forEach((key,i)=>{const row=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=true;
 const swatch=document.createElement('span');swatch.className='swatch';swatch.style.background=colors[i];row.append(check,swatch,document.createTextNode(label(key)));row.title=data.criteria[key];
 check.onchange=()=>{check.checked?visible.add(key):visible.delete(key);draw();};$('legend').append(row);});
$('task').onchange=selectTask;$('revision').onchange=showSpec;$('diff').onchange=showSpec;
$('previous').onclick=()=>{$('revision').selectedIndex--;showSpec();};$('next').onclick=()=>{$('revision').selectedIndex++;showSpec();};selectTask();
</script></html>
